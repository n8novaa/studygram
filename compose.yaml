services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studygram
      POSTGRES_USER: studygram
      POSTGRES_PASSWORD: studygram-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygram -d studygram"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-deploy
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://studygram:studygram-local-only@db:5432/studygram
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      FRONTEND_URL: http://localhost:8080
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DJANGO_MEDIA_ROOT: /app/backend/media
      DJANGO_STATIC_ROOT: /app/backend/staticfiles
      MEDIA_STORAGE_BACKEND: filesystem
      TRUST_PROXY_SSL_HEADER: "True"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - studygram-media:/app/backend/media
      - studygram-static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    volumes:
      - studygram-static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 4s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  studygram-media:
  studygram-static:
